version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: workizo_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-workizo_db}
      MYSQL_USER: ${DB_USER:-workizo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-workizo_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis Channel Layer for WebSockets & Caching
  redis:
    image: redis:7-alpine
    container_name: workizo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Django Backend ASGI Server (Daphne)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workizo_backend
    restart: always
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-key-change-me}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DB_NAME=${DB_NAME:-workizo_db}
      - DB_USER=${DB_USER:-workizo_user}
      - DB_PASSWORD=${DB_PASSWORD:-workizo_password}
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-webmaster@localhost}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_51O2p3D4R5S6T7U}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-dummy_secret_value}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles

  # Nginx Reverse Proxy (Serving Frontend SPA & Routing API/WebSockets)
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workizo_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_media:/usr/share/nginx/html/media:ro
      - backend_static:/usr/share/nginx/html/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  mysql_data:
  redis_data:
  backend_media:
  backend_static:
